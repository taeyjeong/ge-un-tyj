project_id = "gender-equality-un-data"

[auth]
site_url = "https://ge-un-tyj.vercel.app"
additional_redirect_urls = [
  "https://ge-un-tyj.vercel.app/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3018/**",
  "http://localhost:3020/**",
  "http://127.0.0.1:3020/**"
]

# Preserve the new project's existing authentication and infrastructure settings.
[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.sms]
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.vector]
enabled = false
